<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>幼儿园公众号排版助手 · 一键复制底座</title>
<style>
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#F4F1EA;color:#3F4944;}
.toolbar{max-width:677px;margin:0 auto;padding:22px 18px 12px;}
.toolbar h1{font-size:17px;line-height:1.5;margin:0 0 8px;font-weight:600;}
.toolbar p{font-size:13px;line-height:1.8;color:#68726C;margin:0 0 14px;}
button{border:0;border-radius:8px;padding:11px 22px;background:#6E918E;color:#FFFFFF;font-size:15px;cursor:pointer;}
#tip{font-size:13px;margin-left:10px;color:#68726C;}
.preview-shell{max-width:677px;margin:10px auto 48px;background:#FFFFFF;border:1px solid #E4DDD3;}
</style>
</head>
<body>
<div class="toolbar">
  <h1>幼儿园公众号排版助手 · 微信兼容预览</h1>
  <p>点击按钮只复制正式正文的 <strong>text/html</strong>。按钮、说明和预览外壳不会进入公众号正文。</p>
  <button id="copyBtn">一键复制到公众号</button><span id="tip"></span>
</div>

<div class="preview-shell">
  <section id="wx-preview">
    <section style="margin:0;padding:0;background-color:#FFFFFF;">
      <section style="margin:0;padding:0;background-color:#F7F2E9;">
        <section style="margin:0;padding:26px 18px 12px;background-color:#F7F2E9;text-align:center;">
          <section style="margin:0;padding:24px 16px;background-color:#FFFDFC;border:1px solid #EDE4D8;border-radius:18px;">
            <p style="margin:0;padding:0;font-size:13px;line-height:1.7;color:#6E918E;">静享亲子阅读时光</p>
            <p style="margin:12px 0 0;padding:0;font-size:28px;line-height:1.5;color:#43514F;font-weight:bold;">亲子故事会</p>
            <p style="margin:8px 0 0;padding:0;font-size:12px;line-height:1.8;letter-spacing:2px;color:#B98B68;">PARENT · CHILD · STORY</p>
          </section>
        </section>
        <section style="margin:0;padding:12px 20px 30px;background-color:#F7F2E9;">
          <section style="margin:0;padding:26px 18px;background-color:#FFFDFC;border:1px solid #EDE4D8;border-radius:14px;text-align:center;">
            <p style="margin:0;padding:0;font-size:15px;line-height:1.9;color:#4E5558;">这里替换为本次生成的正式公众号正文。</p>
          </section>
        </section>
      </section>
    </section>
  </section>
</div>

<script>
(function(){
  var btn=document.getElementById('copyBtn');
  var tip=document.getElementById('tip');
  var source=document.getElementById('wx-preview');

  function html(){
    return source.innerHTML;
  }

  function manualFallback(){
    var range=document.createRange();
    range.selectNodeContents(source);
    var sel=window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    var ok=false;
    try{ok=document.execCommand('copy');}catch(e){ok=false;}
    sel.removeAllRanges();
    return ok;
  }

  btn.addEventListener('click',function(){
    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
      var item=new ClipboardItem({
        'text/html':new Blob([html()],{type:'text/html'})
      });
      navigator.clipboard.write([item]).then(function(){
        tip.textContent='✓ 已复制，可粘贴到公众号后台';
        tip.style.color='#52716D';
      }).catch(function(){
        var ok=manualFallback();
        tip.textContent=ok?'✓ 已复制；建议粘贴后检查样式':'复制失败，请手动选中正文区域复制';
        tip.style.color=ok?'#52716D':'#A36D52';
      });
    }else{
      var ok=manualFallback();
      tip.textContent=ok?'✓ 已复制；建议粘贴后检查样式':'浏览器不支持，请手动选中正文区域复制';
      tip.style.color=ok?'#52716D':'#A36D52';
    }
  });
})();
</script>
</body>
</html>
